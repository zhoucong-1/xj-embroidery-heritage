# Cloudflare Pages Configuration
# 此文件用于 Cloudflare Pages 自动部署

compatibility_flags = []
pages_build_output_dir = "frontend"

# 构建设置（如果需要）
[build]
  command = ""
  directory = "frontend"

# 环境变量（如有需要）
[env.production]
  variables = {
    NODE_VERSION = "18"
  }

# 路由设置
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200