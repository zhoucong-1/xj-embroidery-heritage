<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录 - 绣缕山河·云展新疆</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-header h1 {
      color: #667eea;
      margin: 0 0 10px 0;
      font-size: 2em;
    }
    
    .login-header p {
      color: #666;
      margin: 0;
    }
    
    .login-tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }
    
    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .tab.active {
      color: #667eea;
      border-bottom: 2px solid #667eea;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #666;
      font-weight: 500;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .role-selector {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    
    .role-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    
    .role-option input[type="radio"] {
      width: auto;
    }
    
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f8f9fa;
      color: #333;
      border: 2px solid #eee;
    }
    
    .btn-secondary:hover {
      background: #e9ecef;
    }
    
    .form-footer {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }
    
    .form-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    
    .form-footer a:hover {
      text-decoration: underline;
    }
    
    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .form-panel {
      display: none;
    }
    
    .form-panel.active {
      display: block;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(102, 126, 234, 0.3);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>绣缕山河·云展新疆</h1>
    <p>新疆非遗刺绣数字传承平台</p>
  </header>

  <div class="login-container">
    <div class="login-header">
      <h1>用户登录</h1>
      <p>欢迎回来，登录后继续您的非遗之旅</p>
    </div>

    <div class="login-tabs">
      <div class="tab active" data-tab="login">登录</div>
      <div class="tab" data-tab="register">注册</div>
    </div>

    <div id="message" class="message" style="display: none;"></div>

    <!-- 登录表单 -->
    <div class="form-panel active" id="login-panel">
      <form id="login-form">
        <div class="role-selector">
          <div class="role-option">
            <input type="radio" name="role" id="role-user" value="user" checked>
            <label for="role-user">用户登录</label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-admin" value="admin">
            <label for="role-admin">管理登录</label>
          </div>
        </div>

        <div class="form-group">
          <label for="login-username">用户名</label>
          <input type="text" id="login-username" name="username" required>
        </div>

        <div class="form-group">
          <label for="login-password">密码</label>
          <input type="password" id="login-password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          <span id="login-text">登录</span>
          <span id="login-loading" class="loading" style="display: none;"></span>
        </button>

        <div class="form-footer">
          还没有账号？ <a href="#" id="switch-to-register">立即注册</a>
        </div>
      </form>
    </div>

    <!-- 注册表单 -->
    <div class="form-panel" id="register-panel">
      <form id="register-form">
        <div class="form-group">
          <label for="register-username">用户名</label>
          <input type="text" id="register-username" name="username" required>
        </div>

        <div class="form-group">
          <label for="register-email">邮箱</label>
          <input type="email" id="register-email" name="email" required>
        </div>

        <div class="form-group">
          <label for="register-password">密码</label>
          <input type="password" id="register-password" name="password" required>
        </div>

        <div class="role-selector">
          <div class="role-option">
            <input type="radio" name="register-role" id="register-role-user" value="user" checked>
            <label for="register-role-user">普通用户</label>
          </div>
          <div class="role-option">
            <input type="radio" name="register-role" id="register-role-admin" value="admin">
            <label for="register-role-admin">管理员</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="register-btn">
          <span id="register-text">注册</span>
          <span id="register-loading" class="loading" style="display: none;"></span>
        </button>

        <div class="form-footer">
          已有账号？ <a href="#" id="switch-to-login">立即登录</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import API_CONFIG from './js/config.js';

    // 切换标签页
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        const targetTab = this.dataset.tab;
        
        // 切换标签样式
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        
        // 切换表单面板
        document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));
        document.getElementById(`${targetTab}-panel`).classList.add('active');
      });
    });

    // 切换到注册
    document.getElementById('switch-to-register').addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelector('.tab[data-tab="register"]').click();
    });

    // 切换到登录
    document.getElementById('switch-to-login').addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelector('.tab[data-tab="login"]').click();
    });

    // 显示消息
    function showMessage(message, type = 'success') {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';
      
      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 3000);
    }

    // 登录表单
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      
      const loginBtn = document.getElementById('login-btn');
      const loginText = document.getElementById('login-text');
      const loginLoading = document.getElementById('login-loading');
      
      // 显示加载状态
      loginBtn.disabled = true;
      loginText.style.display = 'none';
      loginLoading.style.display = 'inline-block';
      
      try {
        const response = await fetch(`${API_CONFIG.BASE_URL}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password, role })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // 存储用户信息到localStorage
          localStorage.setItem('user', JSON.stringify(data));
          
          // 根据角色跳转
          if (role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          showMessage(data.error || '登录失败', 'error');
        }
      } catch (error) {
        console.error('登录失败:', error);
        showMessage('登录失败，请稍后重试', 'error');
      } finally {
        // 恢复按钮状态
        loginBtn.disabled = false;
        loginText.style.display = 'inline';
        loginLoading.style.display = 'none';
      }
    });

    // 注册表单
    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const role = document.querySelector('input[name="register-role"]:checked').value;
      
      const registerBtn = document.getElementById('register-btn');
      const registerText = document.getElementById('register-text');
      const registerLoading = document.getElementById('register-loading');
      
      // 显示加载状态
      registerBtn.disabled = true;
      registerText.style.display = 'none';
      registerLoading.style.display = 'inline-block';
      
      try {
        const response = await fetch(`${API_CONFIG.BASE_URL}/api/auth/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password, role })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('注册成功，请登录');
          // 切换到登录表单
          setTimeout(() => {
            document.querySelector('.tab[data-tab="login"]').click();
          }, 1500);
        } else {
          showMessage(data.error || '注册失败', 'error');
        }
      } catch (error) {
        console.error('注册失败:', error);
        showMessage('注册失败，请稍后重试', 'error');
      } finally {
        // 恢复按钮状态
        registerBtn.disabled = false;
        registerText.style.display = 'inline';
        registerLoading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
